version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: helpdesk-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: helpdesk
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: helpdesk-server
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/helpdesk?schema=public
      - PORT=3000
      - NODE_ENV=production
    depends_on:
      - db

volumes:
  postgres_data:
